<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg:#FDF7EB; --ink:#2A1A24; --soft:#6E5A66; --line:#E9DDCF; --pink:#E000B8; --card:#FFFDF8; --err:#B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1B1218; --ink:#F6ECE2; --soft:#BBA9B4; --line:#3A2A35; --pink:#FF4FD8; --card:#251922; --err:#FF8A80; color-scheme: dark; } }
  html, body { overflow-x: clip; max-width: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 32px 28px; box-sizing: border-box; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.1; margin: 0 0 8px; }
  h1 em { color: var(--pink); font-weight: 400; }
  p { margin: 0 0 20px; color: var(--soft); font-size: 15px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  input:focus { outline: 2px solid var(--pink); outline-offset: 1px; }
  button { margin-top: 14px; width: 100%; font: inherit; font-weight: 600; font-size: 15px; padding: 12px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--soft); }
  #msg.err { color: var(--err); }
  #lb { position: fixed; inset: 0; z-index: 1000; background: rgba(12,6,10,.94); display: none; align-items: center; justify-content: center; padding: 60px 16px 70px; box-sizing: border-box; }
  #lb.on { display: flex; }
  #lb.has-ref { padding-bottom: 120px; }
  #lb .stage { position: relative; height: 100%; max-width: 100%; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
  #lb .stage img, #lb .stage video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; background: #000; display: block; }
  #lb button { position: absolute; margin: 0; padding: 0; width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; font-size: 26px; line-height: 44px; }
  #lb .x { top: 12px; right: 12px; }
  #lb .nav { top: 50%; transform: translateY(-50%); font-size: 30px; }
  #lb .prev { left: 10px; } #lb .next { right: 10px; }
  #lb .nav[hidden] { display: none; }
  #lb .count { position: absolute; top: 22px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; font-weight: 600; pointer-events: none; }
  #lb .dots { position: absolute; bottom: 44px; left: 0; right: 0; display: flex; gap: 6px; justify-content: center; pointer-events: none; }
  #lb .dots i { width: 6px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.35); }
  #lb .dots i.on { background: #fff; }
  #lb .refbtn { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: #fff; color: #2A1A24; font-size: 14px; font-weight: 600; text-decoration: none; }
  #lb .refbtn[hidden] { display: none; }
  #lb .lbcap { position: absolute; bottom: 14px; left: 16px; right: 16px; text-align: center; color: #fff; font-size: 14px; opacity: .85; }
  .tile .refpill { position: relative; align-self: flex-start; margin-top: 5px; padding: 3px 8px; white-space: nowrap; border-radius: 999px; background: #fff; color: #2A1A24; font-size: 11px; font-weight: 700; text-decoration: none; box-shadow: 0 1px 3px rgba(0,0,0,.25); cursor: pointer; }
  .tile[data-href]:not(.photo) { cursor: pointer; }
  .tile [data-slide] { display: none !important; }
  .tile.photo { cursor: zoom-in; }
  .tile.photo::after { content: "\2922"; position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; display: grid; place-items: center; }
  .tile.photo.is-video::after { content: "\25B6"; font-size: 10px; }
    .tile.photo.is-carousel::after { content: attr(data-n); width: auto; padding: 0 7px; font-size: 10.5px; font-weight: 700; }
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="f" autocomplete="off">
    <h1>12 Naughty Nights <em>preview</em></h1>
    <p>This draft is private. Enter the password to open it.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autofocus>
    <button id="go" type="submit">Open</button>
    <div id="msg" role="status"></div>
  </form>
</div>
<div id="page" hidden></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Post preview"><div class="count"></div><div class="stage"></div><button type="button" class="nav prev" aria-label="Previous slide">&lsaquo;</button><button type="button" class="nav next" aria-label="Next slide">&rsaquo;</button><button type="button" class="x" aria-label="Close">&times;</button><div class="dots"></div><a class="refbtn" target="_blank" rel="noopener" hidden>See reference &#8599;</a><div class="lbcap"></div></div>
<script>
const SALT = '439f74a5e13bd96e242ef03039ad44de', ITER = 250000;
const hex = h => new Uint8Array(h.match(/../g).map(b => parseInt(b, 16)));
const norm = p => p.toLowerCase().split(/\s+/).filter(Boolean).join(' ');
async function keyFor(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: hex(SALT), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function open1(key, file) {
  const buf = new Uint8Array(await (await fetch('d/' + file, { cache: 'no-cache' })).arrayBuffer());
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
}
const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault();
  msg.className = ''; msg.textContent = 'Checking…'; go.disabled = true;
  let key, data;
  try {
    key = await keyFor(document.getElementById('pw').value);
    data = JSON.parse(new TextDecoder().decode(await open1(key, 'page.bin')));
  } catch (err) {
    msg.className = 'err'; msg.textContent = 'That password is not right. Try again.'; go.disabled = false; return;
  }
  let html = data.html;
  const byPath = {}; data.assets.forEach(a => byPath[a.p] = a);
  const cache = {};
  const blobUrl = a => cache[a.p] || (cache[a.p] = open1(key, a.f).then(buf => URL.createObjectURL(new Blob([buf], { type: a.m }))));
  const eager = data.assets.filter(a => a.e);
  msg.textContent = 'Opening…';
  let urls;
  try { urls = await Promise.all(eager.map(blobUrl)); }
  catch (err) { msg.className = 'err'; msg.textContent = 'The page was just updated. Please refresh and try again.'; go.disabled = false; return; }
  eager.forEach((a, i) => { html = html.split('"' + a.p + '"').join('"' + urls[i] + '"'); });
  const fixX = () => { if (window.scrollX !== 0) window.scrollTo(0, window.scrollY); if (document.documentElement.scrollLeft) document.documentElement.scrollLeft = 0; if (document.body.scrollLeft) document.body.scrollLeft = 0; };
  window.addEventListener('scroll', fixX, { passive: true }); window.addEventListener('resize', fixX);
  document.title = data.title;
  const page = document.getElementById('page');
  page.innerHTML = html;
  document.getElementById('gate').remove();
  page.hidden = false;
  fixX();
  const vids = [...page.querySelectorAll('video[data-src]')];
  (async () => {
    let i = 0;
    const worker = async () => { while (i < vids.length) { const v = vids[i++]; const a = byPath[v.dataset.src]; if (!a) continue;
      try { v.src = await blobUrl(a); v.muted = true; v.loop = true; if (!v.hasAttribute('data-slide')) v.play().catch(() => {}); } catch (e) {} } };
    await Promise.all([worker(), worker(), worker()]);
  })();
  const fullSrc = async m => {
    if (m.tagName !== 'VIDEO') return m.currentSrc || m.src;
    const a = byPath[m.dataset.full] || byPath[m.dataset.src];
    return a ? blobUrl(a) : (m.currentSrc || m.src);
  };
  const lb = document.getElementById('lb'), stage = lb.querySelector('.stage'), lc = lb.querySelector('.lbcap'),
        cnt = lb.querySelector('.count'), dots = lb.querySelector('.dots'), prev = lb.querySelector('.prev'), next = lb.querySelector('.next');
  let slides = [], idx = 0;
  const show = i => {
    idx = (i + slides.length) % slides.length;
    stage.querySelectorAll('video').forEach(v => v.pause());
    stage.innerHTML = '';
    const s = slides[idx], el = document.createElement(s.video ? 'video' : 'img');
    const my = idx;
    if (s.video) {
      el.controls = true; el.playsInline = true; el.loop = true; if (s.poster) el.poster = s.poster;
      fullSrc(s.el).then(u => { if (my !== idx || !lb.classList.contains('on')) return; el.src = u; el.muted = false; el.play().catch(() => { el.muted = true; el.play(); }); });
    } else { el.src = s.el.currentSrc || s.el.src; el.alt = ''; }
    stage.appendChild(el);
    const multi = slides.length > 1;
    prev.hidden = next.hidden = !multi;
    cnt.textContent = multi ? (idx + 1) + ' / ' + slides.length : '';
    dots.innerHTML = multi ? slides.map((_, k) => '<i' + (k === idx ? ' class="on"' : '') + '></i>').join('') : '';
  };
  const close = () => { lb.classList.remove('on'); stage.querySelectorAll('video').forEach(v => v.pause()); stage.innerHTML = ''; };
  page.querySelectorAll('.tile[data-href]').forEach(t => {
    const a = document.createElement('a');
    a.className = 'refpill'; a.href = t.dataset.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'See reference \u2197';
    a.addEventListener('click', e => e.stopPropagation());
    t.appendChild(a);
    if (!t.querySelector('img, video')) t.addEventListener('click', () => window.open(t.dataset.href, '_blank', 'noopener'));
  });
  page.querySelectorAll('.tile').forEach(t => {
    const media = [...t.querySelectorAll('img, video')];
    if (!media.length) return;
    const list = media.map(m => ({ el: m, poster: m.getAttribute('poster') || '', video: m.tagName === 'VIDEO' }));
    t.classList.add('photo');
    if (list.length > 1) { t.classList.add('is-carousel'); t.dataset.n = '1/' + list.length; }
    else if (list[0].video) t.classList.add('is-video');
    t.addEventListener('click', () => {
      const rb = lb.querySelector('.refbtn'); if (t.dataset.href) { rb.href = t.dataset.href; rb.hidden = false; lb.classList.add('has-ref'); } else { rb.hidden = true; lb.classList.remove('has-ref'); }
      slides = list; lc.textContent = (t.querySelector('.cap')?.textContent || '').trim();
      lb.classList.add('on'); show(0);
    });
  });
  prev.addEventListener('click', e => { e.stopPropagation(); show(idx - 1); });
  next.addEventListener('click', e => { e.stopPropagation(); show(idx + 1); });
  lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('x')) close(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('on')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(idx - 1);
    if (e.key === 'ArrowRight') show(idx + 1);
  });
  let x0 = null;
  stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40 && slides.length > 1) show(idx + (dx < 0 ? 1 : -1));
  });
});
</script>
</body>
</html>
