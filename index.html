<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg:#FDF7EB; --ink:#2A1A24; --soft:#6E5A66; --line:#E9DDCF; --pink:#E000B8; --card:#FFFDF8; --err:#B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1B1218; --ink:#F6ECE2; --soft:#BBA9B4; --line:#3A2A35; --pink:#FF4FD8; --card:#251922; --err:#FF8A80; color-scheme: dark; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 32px 28px; box-sizing: border-box; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.1; margin: 0 0 8px; }
  h1 em { color: var(--pink); font-weight: 400; }
  p { margin: 0 0 20px; color: var(--soft); font-size: 15px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  input:focus { outline: 2px solid var(--pink); outline-offset: 1px; }
  button { margin-top: 14px; width: 100%; font: inherit; font-weight: 600; font-size: 15px; padding: 12px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--soft); }
  #msg.err { color: var(--err); }
  #lb { position: fixed; inset: 0; z-index: 1000; background: rgba(12,6,10,.92); display: none; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  #lb.on { display: flex; }
  #lb video { max-width: 100%; max-height: 100%; height: 100%; aspect-ratio: 9/16; object-fit: contain; border-radius: 10px; background: #000; }
  #lb button { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; margin: 0; padding: 0; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: 26px; line-height: 44px; }
  #lb .lbcap { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; opacity: .85; }
  .tile.photo { cursor: zoom-in; }
  .tile.photo::after { content: "\25B6"; position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; font-size: 10px; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="f" autocomplete="off">
    <h1>12 Naughty Nights <em>preview</em></h1>
    <p>This draft is private. Enter the password to open it.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autofocus>
    <button id="go" type="submit">Open</button>
    <div id="msg" role="status"></div>
  </form>
</div>
<div id="page" hidden></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Video preview"><button type="button" aria-label="Close">&times;</button><video controls playsinline loop></video><div class="lbcap"></div></div>
<script>
const SALT = '9ad97fed7258e1fa46d49454efd97bb0', ITER = 250000;
const hex = h => new Uint8Array(h.match(/../g).map(b => parseInt(b, 16)));
const norm = p => p.toLowerCase().split(/\s+/).filter(Boolean).join(' ');
async function keyFor(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: hex(SALT), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function open1(key, file) {
  const buf = new Uint8Array(await (await fetch('d/' + file, { cache: 'no-cache' })).arrayBuffer());
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
}
const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault();
  msg.className = ''; msg.textContent = 'Checking…'; go.disabled = true;
  let key, data;
  try {
    key = await keyFor(document.getElementById('pw').value);
    data = JSON.parse(new TextDecoder().decode(await open1(key, 'page.bin')));
  } catch (err) {
    msg.className = 'err'; msg.textContent = 'That password is not right. Try again.'; go.disabled = false; return;
  }
  let html = data.html, done = 0;
  for (const a of data.assets) {
    msg.textContent = `Loading ${++done} of ${data.assets.length}…`;
    let buf;
    try { buf = await open1(key, a.f); } catch (err) { msg.className = 'err'; msg.textContent = 'The page was just updated. Please refresh and try again.'; go.disabled = false; return; }
    const url = URL.createObjectURL(new Blob([buf], { type: a.m }));
    html = html.split('"' + a.p + '"').join('"' + url + '"');
  }
  document.title = data.title;
  const page = document.getElementById('page');
  page.innerHTML = html;
  document.getElementById('gate').remove();
  page.hidden = false;
  page.querySelectorAll('video').forEach(v => { v.muted = true; v.play().catch(() => {}); });
  const lb = document.getElementById('lb'), lv = lb.querySelector('video'), lc = lb.querySelector('.lbcap');
  const close = () => { lb.classList.remove('on'); lv.pause(); lv.removeAttribute('src'); lv.load(); };
  page.querySelectorAll('.tile video').forEach(v => {
    const t = v.closest('.tile');
    t.addEventListener('click', () => {
      lv.src = v.currentSrc || v.src; lv.muted = false; lc.textContent = (t.querySelector('.cap')?.textContent || '').trim();
      lb.classList.add('on'); lv.currentTime = 0; lv.play().catch(() => { lv.muted = true; lv.play(); });
    });
  });
  lb.addEventListener('click', e => { if (e.target === lb || e.target.tagName === 'BUTTON') close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('on')) close(); });
});
</script>
</body>
</html>
